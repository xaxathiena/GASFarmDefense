Công việc sau:
- Economic.
+ mỗi wave sẽ được cung cấp một số lượng hạt: 10 hạt
+ người chơi sẽ quyết định số lượng hạt đó trồng loại cây gì.
+ Hạt sẽ có N wave mới ra quả (hiện tại là 2 wave), mỗi hạt sẽ ra từ 5 đến 10 quả (random)
+ mỗi wave, giá cả của các loại quả sẽ khác nhau, nhưng nó sẽ nó sẽ giao động từ min đến max của thị trường. Max và min này áp dụng cho toàn bộ loại quả.
+ Người chơi bán quả thì nhận được tiền.
- Config wave có thêm lựa chọn thẻ.
+  Nếu có, người chơi sẽ được lựa chọn 1 trong 3 option
   * 1 là giá cả tăng 10%, tức là giá trị min và max của thị trường tăng 10%.
   * 2 là được 1 thẻ tower cấp 5.
   * 3 là tăng sức mạnh của toàn bộ tower lên 10%.
+ Đến wave đó, nếu có option chọn thẻ, UI sẽ hiện 3 thẻ với nội dung tương ứng trên màn hình.
+ Ở dưới mỗi thẻ sẽ có nút chọn. Nếu ấn chọn, hiệu ứng sẽ được áp dụng.
+ Có thêm nút Hold (tên thì nghĩ cho tôi tên phù hợp), nút này kiểu người chơi sẽ chọn sau. Khi ấn nút này, 1 lá bài sẽ xuất hiện trên tay của người chơi, khi drag lá bài này lên, 3 options kia sẽ lại xuất hiện, vẫn có nút hold để tạm thời chưa dùng.


- Shop:
+ Config item, tôi cần hệ thống item attach vào tower. 


